name: Build Scorg APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore stable Scorg debug keystore
      uses: actions/cache@v4
      with:
        path: .signing/scorg-debug.keystore
        key: scorg-debug-keystore-v2

    - name: Create debug keystore if missing
      shell: bash
      run: |
        mkdir -p .signing
        if [ ! -f .signing/scorg-debug.keystore ]; then
          keytool -genkeypair \
            -keystore .signing/scorg-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK (Skipping Grammar Police)
      run: ./gradlew assembleDebug -x lint -x detekt

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Scorg-App
        path: app/build/outputs/apk/debug/*.apk
